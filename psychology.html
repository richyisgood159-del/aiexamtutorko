<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Exam Tutor · Psychology</title><link rel="stylesheet" href="styles.css?v=11fix2"><style>
.psych-shell{max-width:none;margin:0}.psych-source{width:100%;display:block;border:0;background:#fff}.ao-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.ao-card{padding:12px;border:1px solid #dfe5ee;border-radius:12px;background:#fff}.level-badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-weight:700}.psych-note{padding:12px 14px;background:#f6f8fb;border-radius:12px;margin:12px 0}.manual-score button{margin:4px}.paperGrid{align-items:stretch}
.psych-viewer{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}.psych-exam{background:#fff;border:1px solid var(--line);border-radius:16px;padding:27px;min-width:0}.psych-side{position:sticky;top:84px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.psych-question-frame{border:1px solid #dfe3ee;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 6px 20px rgba(18,28,61,.06);margin:14px 0 22px}.psych-question-frame img{width:100%;height:auto;display:block}.psych-answer{width:100%;min-height:230px;border:1px solid #cfd4de;border-radius:11px;padding:15px;font:inherit;line-height:1.55;resize:vertical;background:#fff}.psych-answer.extended{min-height:360px}.psych-answer:focus{outline:3px solid #ecebff;border-color:var(--accent)}.psych-side h3{margin:0 0 8px}.psych-side p{font-size:13px;color:var(--muted);line-height:1.45}.psych-side .actions{flex-wrap:wrap}.psych-side .actions button{flex:1}.psych-ms{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.psych-ms img{width:100%;height:auto;display:block;border:1px solid #dfe3ee;border-radius:14px}.resultCard{margin-top:22px;border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff}.scoreBig{font-size:40px;font-weight:900;color:var(--accent)}
@media(max-width:850px){.psych-viewer{grid-template-columns:1fr}.psych-side{position:static}.ao-grid{grid-template-columns:1fr}.psych-answer.extended{min-height:300px}}
</style></head><body><div id="app" class="psych-shell"></div><script src="api-config.js?v=11fix2"></script><script src="psych-data.js?v=11fix2"></script><script src="psych-app.js?v=11fix2"></script></body></html>
